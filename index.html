<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xsocial v3.0 - Мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #2c3e50;
            overflow: hidden;
        }

        /* Модальное окно авторизации */
        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .auth-modal.hidden {
            display: none;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .auth-box h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .auth-box p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            color: #7f8c8d;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            border-color: #000;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-box input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            color: #2c3e50;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .auth-box input:focus {
            outline: none;
            border-color: #000;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .auth-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2c3e50 0%, #000 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .auth-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Основной контейнер */
        .container {
            display: flex;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Кнопка гамбургер */
        .hamburger-btn {
            display: none;
            background: rgba(0, 0, 0, 0.9);
            border: none;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .hamburger-btn:hover {
            transform: scale(1.05);
        }

        .hamburger-icon {
            display: block;
            width: 25px;
            height: 3px;
            background: #fff;
            position: relative;
            transition: all 0.3s ease;
        }

        .hamburger-icon::before,
        .hamburger-icon::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 3px;
            background: #fff;
            transition: all 0.3s ease;
        }

        .hamburger-icon::before {
            top: -8px;
        }

        .hamburger-icon::after {
            top: 8px;
        }

        /* Оверлей для мобильных */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* Левая панель */
        .sidebar {
            width: 340px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 25px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .profile-section {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .profile-section h2 {
            color: #2c3e50;
            font-size: 1.3rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .profile-section p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .profile-section .username {
            color: #000;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .rooms-section {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .rooms-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .room-item {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .room-item:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.2);
            transform: translateX(5px);
        }

        .room-item.active {
            background: rgba(0, 0, 0, 0.05);
            border-color: #000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .room-item h4 {
            color: #2c3e50;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .room-item p {
            color: #7f8c8d;
            font-size: 0.85rem;
        }

        .add-user-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .add-user-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            transform: translateY(-2px);
        }

        .add-user-btn .plus-icon {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Правая панель - чат */
        .chat-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 25px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 18px 25px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .chat-header h2 {
            color: #2c3e50;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 18px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .message.sent .message-bubble {
            background: rgba(0, 0, 0, 0.05);
            border: 2px solid rgba(0, 0, 0, 0.1);
        }

        .message.received .message-bubble {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .message-sender {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .message.sent .message-sender {
            color: #000;
        }

        .message.received .message-sender {
            color: #2c3e50;
        }

        .message-text {
            color: #2c3e50;
            line-height: 1.5;
        }

        .message-time {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-top: 8px;
            text-align: right;
        }

        .input-container {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 18px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .input-container input {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: #2c3e50;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-container input:focus {
            outline: none;
            border-color: #000;
            background: rgba(255, 255, 255, 0.95);
        }

        .send-btn {
            background: linear-gradient(135deg, #2c3e50 0%, #000 100%);
            border: none;
            border-radius: 12px;
            padding: 14px 35px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Адаптивность */
        @media (max-width: 1024px) {
            .container {
                padding: 15px;
                gap: 15px;
            }

            .sidebar {
                width: 280px;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            body {
                overflow: visible;
            }

            .container {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
                height: 100vh;
            }

            .hamburger-btn {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 85%;
                max-width: 320px;
                height: 100vh;
                z-index: 100;
                border-radius: 0 25px 25px 0;
                transform: translateX(-100%);
                overflow-y: auto;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .profile-section p {
                display: none;
            }

            .room-item p {
                display: none;
            }

            .add-user-btn span:last-child {
                display: none;
            }

            .chat-panel {
                flex: 1;
                padding: 15px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .input-container {
                padding: 12px;
            }

            .send-btn {
                padding: 12px 20px;
            }
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 12px 20px;
            color: #2c3e50;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 999;
            display: none;
        }

        .connection-status.visible {
            display: block;
        }

        .connection-status.error {
            background: rgba(255, 100, 100, 0.2);
            border-color: rgba(255, 0, 0, 0.3);
            color: #c0392b;
        }

        .connection-status.success {
            background: rgba(100, 255, 100, 0.2);
            border-color: rgba(0, 200, 0, 0.3);
            color: #27ae60;
        }
    </style>
</head>
<body>
    <!-- Модальное окно авторизации -->
    <div class="auth-modal" id="authModal">
        <div class="auth-box">
            <h1>Xsocial v3.0</h1>
            <p>Мессенджер с приватными чатами</p>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>

            <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                <input type="text" id="registerUsername" placeholder="Имя пользователя" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Пароль (мин. 6 символов)" required minlength="6">
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="connection-status" id="connectionStatus"></div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="profile-section">
                <h2>👤 Профиль</h2>
                <p>Текущий пользователь:</p>
                <p class="username" id="currentUserDisplay">-</p>
            </div>

            <div class="rooms-section">
                <h3>💬 Чаты</h3>
                <div class="room-item active" onclick="switchToPublicRoom('Главный зал', this)">
                    <h4>🌐 Главный зал</h4>
                    <p>Общая комната</p>
                </div>
                <!-- Сюда будут добавляться приватные чаты -->
                <div id="privateChatsList"></div>
            </div>

            <button class="add-user-btn" onclick="showAddUserModal()">
                <span class="plus-icon">+</span>
                <span>Новый чат</span>
            </button>
        </div>

        <div class="chat-panel">
            <div class="chat-header">
                <button class="hamburger-btn" onclick="toggleSidebar()">
                    <span class="hamburger-icon"></span>
                </button>
                <h2 id="roomTitle">🌐 Главный зал</h2>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // КОНФИГУРАЦИЯ SUPABASE
        // ============================================
        const supabaseUrl = 'https://ifsokgkfatghsxeoqofl.supabase.co';
        const supabaseKey = 'sb_publishable_WlIcNs2dJz_Se_wJEXM-FA_5IFGi8OL';

        // ============================================
        // ПЕРЕМЕННЫЕ
        // ============================================
        let currentUser = null;
        let currentRoom = 'Главный зал'; // Может быть строкой (публичный) или UUID (приватный)
        let supabaseClient = null;
        let userChats = []; // Список чатов пользователя

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            checkAuth();
        });

        function initSupabase() {
            if (supabaseUrl && supabaseKey) {
                supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
                showStatus('✓ Подключено', 'success');
            } else {
                showStatus('⚠ Supabase не настроен', 'error');
            }
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                currentUser = session.user;
                completeLogin();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }
        }

        // ============================================
        // УПРАВЛЕНИЕ SIDEBAR
        // ============================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        // ============================================
        // АВТОРИЗАЦИЯ
        // ============================================
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.auth-tab:nth-child(1)').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.auth-tab:nth-child(2)').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Ошибка: ' + error.message);
                return;
            }

            currentUser = data.user;
            completeLogin();
        }

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { username } }
            });

            if (error) {
                alert('Ошибка: ' + error.message);
                return;
            }

            if (data.user && !data.session) {
                alert('Проверьте email для подтверждения!');
            } else {
                currentUser = data.user;
                completeLogin();
            }
        }

        async function completeLogin() {
            document.getElementById('authModal').classList.add('hidden');
            const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
            document.getElementById('currentUserDisplay').textContent = username;
            
            await loadUserChats();
            loadMessages();
            startAutoRefresh();
        }

        // ============================================
        // ЗАГРУЗКА ЧАТОВ ПОЛЬЗОВАТЕЛЯ
        // ============================================
        async function loadUserChats() {
            try {
                const { data, error } = await supabaseClient
                    .from('chat_participants')
                    .select('chat_id, chats(id, is_private)')
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                userChats = data || [];
                renderPrivateChats();
                
            } catch (err) {
                console.error('Ошибка загрузки чатов:', err);
            }
        }

        function renderPrivateChats() {
            const container = document.getElementById('privateChatsList');
            container.innerHTML = '';

            userChats.forEach(async (chatData) => {
                const chatId = chatData.chat_id;
                
                // Получаем имя собеседника
                const { data: participants } = await supabaseClient
                    .from('chat_participants')
                    .select('user_id')
                    .eq('chat_id', chatId);

                const otherUserId = participants.find(p => p.user_id !== currentUser.id)?.user_id;
                
                let chatName = 'Личный чат';
                if (otherUserId) {
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('username')
                        .eq('id', otherUserId)
                        .single();
                    
                    if (profile) {
                        chatName = profile.username;
                    }
                }

                const div = document.createElement('div');
                div.className = 'room-item';
                div.onclick = () => switchToPrivateChat(chatId, chatName, this);
                div.innerHTML = `
                    <h4>🔒 ${chatName}</h4>
                    <p>Приватный чат</p>
                `;
                container.appendChild(div);
            });
        }

        // ============================================
        // ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ЧАТАМИ
        // ============================================
        function switchToPublicRoom(roomName, element) {
            currentRoom = roomName;
            
            document.querySelectorAll('.room-item').forEach(item => {
                item.classList.remove('active');
            });
            if (element) element.classList.add('active');
            
            document.getElementById('roomTitle').textContent = `🌐 ${roomName}`;
            loadMessages();
            
            if (window.innerWidth <= 768) closeSidebar();
        }

        function switchToPrivateChat(chatId, chatName, element) {
            currentRoom = chatId;
            
            document.querySelectorAll('.room-item').forEach(item => {
                item.classList.remove('active');
            });
            if (element) element.classList.add('active');
            
            document.getElementById('roomTitle').textContent = `🔒 ${chatName}`;
            loadMessages();
            
            if (window.innerWidth <= 768) closeSidebar();
        }

        // ============================================
        // СОЗДАНИЕ НОВОГО ЧАТА
        // ============================================
        async function showAddUserModal() {
            const targetUsername = prompt('Введите имя пользователя для создания чата:');
            
            if (!targetUsername || !targetUsername.trim()) return;

            try {
                showStatus('Поиск пользователя...', 'success');

                // 1. Ищем пользователя по username
                const { data: targetProfile, error: searchError } = await supabaseClient
                    .from('profiles')
                    .select('id, username')
                    .eq('username', targetUsername.trim())
                    .single();

                if (searchError || !targetProfile) {
                    alert('Пользователь не найден!');
                    showStatus('Пользователь не найден', 'error');
                    return;
                }

                if (targetProfile.id === currentUser.id) {
                    alert('Нельзя создать чат с самим собой!');
                    return;
                }

                // 2. Проверяем, есть ли уже чат
                const { data: existingChats } = await supabaseClient
                    .from('chat_participants')
                    .select('chat_id')
                    .eq('user_id', currentUser.id);

                let chatId = null;

                for (const row of existingChats || []) {
                    const { data: otherParticipants } = await supabaseClient
                        .from('chat_participants')
                        .select('user_id')
                        .eq('chat_id', row.chat_id);
                    
                    if (otherParticipants?.some(p => p.user_id === targetProfile.id)) {
                        chatId = row.chat_id;
                        break;
                    }
                }

                // 3. Создаем новый чат если нужно
                if (!chatId) {
                    const { data: newChat, error: createError } = await supabaseClient
                        .from('chats')
                        .insert([{ is_private: true }])
                        .select()
                        .single();

                    if (createError) throw createError;
                    chatId = newChat.id;

                    await supabaseClient.from('chat_participants').insert([
                        { chat_id: chatId, user_id: currentUser.id },
                        { chat_id: chatId, user_id: targetProfile.id }
                    ]);
                    
                    showStatus('Чат создан!', 'success');
                } else {
                    showStatus('Чат найден!', 'success');
                }

                // 4. Переключаемся на чат
                await loadUserChats();
                switchToPrivateChat(chatId, targetProfile.username);

            } catch (err) {
                console.error(err);
                showStatus('Ошибка создания чата', 'error');
                alert('Ошибка: ' + err.message);
            }
        }

        // ============================================
        // СООБЩЕНИЯ
        // ============================================
                async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value.trim();
            
            if (!messageText) return;

            // Получаем данные пользователя безопасно
            const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
            const userId = currentUser.id;

            // Формируем объект сообщения
            const messageObj = {
                sender: username,
                text: messageText,
                created_at: new Date().toISOString(),
                user_id: userId // Убедись, что эта колонка есть в базе!
            };

            // Определяем, куда отправлять: в приватный чат (chat_id) или общую комнату (room)
            if (currentRoom && currentRoom.length > 20) { 
                // Это UUID приватного чата
                messageObj.chat_id = currentRoom;
                messageObj.room = null; // Или можно оставить пустым, если база позволяет
            } else {
                // Это общая комната
                messageObj.room = currentRoom;
                messageObj.chat_id = null;
            }

            try {
                console.log("Отправляем сообщение:", messageObj); // Для отладки в консоли
                
                const { data, error } = await supabaseClient
                    .from('mesendger')
                    .insert([messageObj])
                    .select(); // Добавили .select(), чтобы увидеть результат

                if (error) {
                    console.error('Ошибка Supabase:', error);
                    showStatus('Ошибка: ' + error.message, 'error');
                } else {
                    console.log('Сообщение успешно отправлено:', data);
                    loadMessages();
                }
            } catch (err) {
                console.error('Критическая ошибка JS:', err);
                showStatus('Произошла непредвиденная ошибка', 'error');
            }

            messageInput.value = '';
            messageInput.focus();
        }

        async function loadMessages() {
            try {
                let query = supabaseClient
                    .from('mesendger')
                    .select('*')
                    .order('created_at', { ascending: true })
                    .limit(100);

                if (currentRoom.length > 20) {
                    query = query.eq('chat_id', currentRoom);
                } else {
                    query = query.eq('room', currentRoom);
                }

                const { data, error } = await query;

                if (error) throw error;
                if (data) renderMessages(data);
                
            } catch (err) {
                console.error('Ошибка загрузки:', err);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];

            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                const isSent = msg.sender === username;
                
                messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
                
                const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                messageDiv.innerHTML = `
                    <div class="message-bubble">
                        <div class="message-sender">${escapeHtml(msg.sender)}</div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;

                container.appendChild(messageDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        // ============================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function startAutoRefresh() {
            setInterval(() => loadMessages(), 3000);
        }

        function showStatus(text, type) {
            const el = document.getElementById('connectionStatus');
            el.textContent = text;
            el.className = 'connection-status visible ' + type;
            
            setTimeout(() => el.classList.remove('visible'), 3000);
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) closeSidebar();
        });
    </script>
</body>
